x-monitor: &monitor
  build: .
  restart: unless-stopped
  mem_limit: 256m
  cpus: 1.0
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 5s
    timeout: 2s
    retries: 5
services:
  monitor-a:
    <<: *monitor
    command: ["server", "/configs/monitor-a.conf"]
    ports: ["127.0.0.1:${MONITOR_A_PORT:-8080}:8080"]
    volumes: ["a-data:/data"]
  monitor-b:
    <<: *monitor
    command: ["server", "/configs/monitor-b.conf"]
    ports: ["127.0.0.1:${MONITOR_B_PORT:-8081}:8080"]
    volumes: ["b-data:/data"]
  monitor-c:
    <<: *monitor
    command: ["server", "/configs/monitor-c.conf"]
    ports: ["127.0.0.1:${MONITOR_C_PORT:-8082}:8080"]
    volumes: ["c-data:/data"]
  device-simulator:
    build: .
    command: ["device", "demo", "monitor-b:8080,monitor-c:8080,monitor-a:8080", "/data/demo.state"]
    restart: unless-stopped
    mem_limit: 64m
    volumes: ["device-data:/data"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  a-data:
  b-data:
  c-data:
  device-data:
  prometheus-data:
